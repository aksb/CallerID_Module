plugins {
    id 'com.android.application'
}

// 版本号统一从仓库根目录的 version.properties 读取（唯一来源，见该文件
// 里的说明），本地在 Android Studio 里直接编译时如果读不到该文件，
// 兜底给 "dev" 不会导致构建失败。
def versionProps = new Properties()
def versionPropsFile = rootProject.file("version.properties")
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}
def appVersionName = versionProps.getProperty("version", "dev")

// versionCode 必须严格递增，但又不想跟上面这个人读的版本号字符串强行换算
// （"4.3" 和 "4.21" 谁大谁小容易产生歧义）。这里改成完全独立的一套方案：
// 由 CI 在构建时用当次构建的 UTC 时间戳（精确到分钟）注入 CI_VERSION_CODE
// 环境变量，天然严格递增、无歧义，本地没有这个环境变量时兜底给 1
// （本地构建不发布，不影响什么）。
def envVersionCode = System.getenv("CI_VERSION_CODE")
def appVersionCode = envVersionCode != null ? envVersionCode.toInteger() : 1

android {
    namespace 'com.aksb2026.callerid.module'
    compileSdk 35

    defaultConfig {
        applicationId "com.aksb2026.callerid.module"
        minSdk 28
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            // 正式签名信息从环境变量读取（CI 里由 GitHub Secrets 注入），
            // 本地没配这几个环境变量时，release 就还是用 debug 签名，
            // 不影响你在电脑上直接编译。
            def ksFile = System.getenv("RELEASE_KEYSTORE_FILE")
            if (ksFile != null && new File(ksFile).exists()) {
                storeFile file(ksFile)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 有正式签名环境变量就用正式签名，没有就退回 debug 签名兜底
            def ksFile = System.getenv("RELEASE_KEYSTORE_FILE")
            def useRealSigning = ksFile != null && new File(ksFile).exists()
            def chosenSigningConfig = useRealSigning ? signingConfigs.release : signingConfigs.debug
            signingConfig chosenSigningConfig
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // XposedBridge — compileOnly，不打进 APK，运行时由 LSPosed 框架提供
    compileOnly 'de.robv.android.xposed:api:82'

    // 网络请求
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // AndroidX（通知帮助类）
    implementation 'androidx.core:core:1.12.0'

    // 悬浮窗内网页查询：深色/浅色模式控制（WebSettingsCompat / WebViewFeature）
    implementation 'androidx.webkit:webkit:1.16.0'
}
