# 唯一的版本号来源。以后要发新版本，只改这一个文件里的这一行，
# push 或者打 tag 时，CI 会自动把这个字符串同步到：
#   - APK 的 versionName、以及产物文件名 CallerIDModule-<version>.apk
#   - 保活模块 module.prop 的 version=、以及文件名 ...-KeepAlive-Magisk-<version>.zip
#   - 系统化模块 module.prop 的 version=、以及文件名 ...-Systemize-Magisk-<version>.zip
#
# 格式没有强制要求，"4.3"、"4.3.1"、"4.3-beta2" 都可以，纯粹给人看、
# 用来在多次测试构建之间自己区分，不参与任何需要严格排序比较的逻辑。
# 真正要求严格递增的 Android versionCode / Magisk versionCode 不从这个
# 字符串换算，由 CI 用构建时间自动生成，跟这里写什么完全无关，见
# .github/workflows 里的说明。
version=4.3
