name: Build & Publish Release APK

# 需要在仓库 Settings -> Secrets and variables -> Actions -> Repository secrets
# 里添加以下4个密钥，release 包才会用正式签名（否则会退回debug签名兜底）：
#   RELEASE_KEYSTORE_BASE64    keystore文件的base64编码（一整行）
#   RELEASE_KEYSTORE_PASSWORD  keystore密码
#   RELEASE_KEY_ALIAS          签名别名
#   RELEASE_KEY_PASSWORD       签名密码（PKCS12格式下和上面keystore密码相同）

# 打 tag（形如 v3.19、v3.19-sb5、v1.0.0 都可以，只要是 v 开头）会触发这个流程：
# 编译 release APK，然后创建一个 GitHub Release 并把 APK 作为附件传上去。
# GitHub Release 的附件对公开仓库是完全公开的，任何人打开 Release 页面
# 点链接就能下载，不需要登录 GitHub 账号（这点跟 Actions 里的 Artifact 不同，
# Artifact 必须登录 GitHub 才能下载）。
#
# v4.3 起：
#   - tag 本身只作为"要不要正式公开发布"的触发信号，不再直接决定版本号
#     文本——版本号统一从仓库根目录的 version.properties 读取，跟
#     build.yml（push 触发的 dev 构建）用的是同一个文件，三个产物
#     （APK / KeepAlive 保活模块 / Systemize 系统化模块）的文件名、
#     module.prop 版本号都自动保持一致。打 tag 前记得先把
#     version.properties 里的版本号改成这次要发的号。
#   - versionCode（Android/Magisk 都要求严格递增的那个整数）不从版本号
#     字符串换算，改成用当次构建的 UTC 时间（精确到分钟的时间戳）自动
#     生成，天然严格递增，无需人管，也不会跟 build.yml 的 dev 构建撞号
#     （dev 构建更早，时间戳天然更小）。
#   - 新增打包 Systemize 系统化模块：内置的"占位 APK"由 :stub 模块编译，
#     这里用的是跟 :app 完全相同的正式签名 key（同一组 RELEASE_KEYSTORE_*
#     secret），保证占位 APK 和这次发布的正式 APK 签名一致——这是
#     Systemize 模块"先装 App/先刷模块顺序随意"这套机制能生效的前提。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write   # 需要这个权限才能创建 Release / 上传附件

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google 在 2026-09-14 前后把已淘汰多年的 'tools' 包从 SDK 仓库彻底
          # 下架了，这个 action 默认会尝试装 'tools platform-tools'，装不到
          # 'tools' 就直接报错退出，导致整个 job 还没轮到我们自己的构建步骤就
          # 失败。这里传空字符串跳过它自己的默认安装（只借用它把 ANDROID_HOME/
          # 证书协议这些环境准备好），实际需要的包由下面这一步显式指定安装。
          packages: ''

      - name: Install Android SDK platform & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Compute shared version info
        id: ver
        run: |
          VERSION=$(grep '^version=' version.properties | cut -d= -f2)
          VCODE=$(( $(date -u +%s) / 60 ))
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "vcode=${VCODE}" >> "$GITHUB_OUTPUT"
          echo "本次发布版本号：${VERSION}（触发 tag：${GITHUB_REF_NAME}），versionCode：${VCODE}"

      - name: Decode release keystore from secret
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          CI_VERSION_CODE: ${{ steps.ver.outputs.vcode }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Rename APK with shared version
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/Aksb2026CallerID-${{ steps.ver.outputs.version }}.apk"

      - name: Package Magisk keep-alive module
        run: |
          WORKDIR=$(mktemp -d)
          cp -r magisk-module/. "$WORKDIR/"
          sed -i "s/^version=.*/version=v${{ steps.ver.outputs.version }}/" "$WORKDIR/module.prop"
          sed -i "s/^versionCode=.*/versionCode=${{ steps.ver.outputs.vcode }}/" "$WORKDIR/module.prop"
          ( cd "$WORKDIR" && zip -rq "$GITHUB_WORKSPACE/out/Aksb2026CallerID-KeepAlive-Magisk-${{ steps.ver.outputs.version }}.zip" . -x ".*" )

      # Systemize 模块内置的占位 APK，用跟 :app 完全相同的正式签名 key 编译，
      # 保证跟上面这次发布的 APK 签名一致。
      - name: Build stub release APK (Systemize placeholder)
        env:
          CI_VERSION_CODE: ${{ steps.ver.outputs.vcode }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle :stub:assembleRelease --stacktrace --no-daemon

      - name: Package Systemize module (release build, real-signed placeholder)
        run: |
          WORKDIR=$(mktemp -d)
          cp -r systemize-module/. "$WORKDIR/"
          cp stub/build/outputs/apk/release/*.apk "$WORKDIR/Aksb2026CallerID-stub.apk"
          sed -i "s/^version=.*/version=v${{ steps.ver.outputs.version }}/" "$WORKDIR/module.prop"
          sed -i "s/^versionCode=.*/versionCode=${{ steps.ver.outputs.vcode }}/" "$WORKDIR/module.prop"
          ( cd "$WORKDIR" && zip -rq "$GITHUB_WORKSPACE/out/Aksb2026CallerID-Systemize-Magisk-${{ steps.ver.outputs.version }}.zip" . -x ".*" )

      - name: Create GitHub Release and upload APK + both Magisk modules
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.apk
            out/*.zip
          generate_release_notes: true
