name: Build APK

# 任意分支 push、发 PR，或手动触发，都会跑一遍编译并把 APK/Magisk 模块
# 作为 workflow 产物（Artifact）上传，在 Actions 运行详情页底部下载
# （下载 Artifact 需要登录 GitHub 账号，仅用于自己/协作者验证编译是否通过）。
# 打 v 开头的 tag 走的是另一个 release.yml，会编译 release 包并发布成
# 公开的 GitHub Release，任何人不登录也能下载，两边不会重复触发。
# 仓库里没有 gradlew/gradle-wrapper.jar 二进制文件，这里改用
# gradle/actions/setup-gradle 直接在 CI 里提供指定版本的 Gradle
# （版本号跟 gradle/wrapper/gradle-wrapper.properties 里写的 8.2 保持一致），
# 不依赖仓库自带 wrapper，效果完全一样。
#
# v4.3 起：
#   - 每次 push 会一起打包出 APK、KeepAlive 保活模块、Systemize 系统化模块
#     三个产物，方便测试的时候一次性拿全（Systemize 是 v4.3 新并入仓库的）。
#   - 版本号统一从仓库根目录的 version.properties 读取（人读的版本号，
#     比如 "4.3"，没有格式要求，你想改成什么都行，见该文件里的说明），
#     三个产物的文件名/module.prop 版本号都跟着这一个文件走，不用分别改。
#   - Android/Magisk 要求严格递增的 versionCode，不从上面这个人读的版本号
#     字符串换算（避免 "4.3" 和 "4.21" 谁大谁小的歧义），改成用当次构建的
#     UTC 时间（精确到分钟数的时间戳）自动生成，天然严格递增，无需人管。
#   - Systemize 模块内置的"占位 APK"由 :stub 模块编译得到；push 触发的
#     这个 dev 构建用的是 debug 签名（跟同一次构建出的 APK 一致，足够
#     用来验证"先装 App/先刷模块顺序随意"这套机制本身），跟正式 Release
#     签名不是同一把 key，不能跟正式发布的 APK 混用，仅供测试。

on:
  push:
    branches: [ "**" ]
    tags-ignore: [ "v*" ]   # 打 v 开头的 tag 走 release.yml，避免重复编译
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 8.2 需要 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google 在 2026-09-14 前后把已淘汰多年的 'tools' 包从 SDK 仓库彻底
          # 下架了，这个 action 默认会尝试装 'tools platform-tools'，装不到
          # 'tools' 就直接报错退出，导致整个 job 还没轮到我们自己的构建步骤就
          # 失败。这里传空字符串跳过它自己的默认安装（只借用它把 ANDROID_HOME/
          # 证书协议这些环境准备好），实际需要的包由下面这一步显式指定安装。
          packages: ''

      - name: Install Android SDK platform & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Compute shared version info
        id: ver
        run: |
          VERSION=$(grep '^version=' version.properties | cut -d= -f2)
          VCODE=$(( $(date -u +%s) / 60 ))
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "vcode=${VCODE}" >> "$GITHUB_OUTPUT"
          echo "本次构建版本号：${VERSION}，versionCode：${VCODE}"

      - name: Build debug APK
        env:
          CI_VERSION_CODE: ${{ steps.ver.outputs.vcode }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Rename APK with shared version
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/Aksb2026CallerID-${{ steps.ver.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aksb2026CallerID-${{ steps.ver.outputs.version }}-apk
          path: out/Aksb2026CallerID-*.apk
          if-no-files-found: error

      - name: Package Magisk keep-alive module
        run: |
          WORKDIR=$(mktemp -d)
          cp -r magisk-module/. "$WORKDIR/"
          sed -i "s/^version=.*/version=v${{ steps.ver.outputs.version }}/" "$WORKDIR/module.prop"
          sed -i "s/^versionCode=.*/versionCode=${{ steps.ver.outputs.vcode }}/" "$WORKDIR/module.prop"
          mkdir -p out
          ( cd "$WORKDIR" && zip -rq "$GITHUB_WORKSPACE/out/Aksb2026CallerID-KeepAlive-Magisk-${{ steps.ver.outputs.version }}.zip" . -x ".*" )

      - name: Upload Magisk keep-alive module artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aksb2026CallerID-KeepAlive-Magisk-${{ steps.ver.outputs.version }}
          path: out/Aksb2026CallerID-KeepAlive-Magisk-*.zip
          if-no-files-found: error

      # Systemize 模块内置的占位 APK，这里用 debug 签名编译——跟上面同一次
      # 构建出的 APK 是同一把 debug key，两者签名一致，足够验证"先装 App/
      # 先刷模块顺序随意"这套机制；但跟正式 Release 签名不是同一把 key，
      # 不能拿这里产出的模块去配官方 Release 页面下载的 APK。
      - name: Build stub debug APK (Systemize placeholder)
        env:
          CI_VERSION_CODE: ${{ steps.ver.outputs.vcode }}
        run: gradle :stub:assembleDebug --stacktrace --no-daemon

      - name: Package Systemize module (dev build, debug-signed placeholder)
        run: |
          WORKDIR=$(mktemp -d)
          cp -r systemize-module/. "$WORKDIR/"
          cp stub/build/outputs/apk/debug/*.apk "$WORKDIR/Aksb2026CallerID-stub.apk"
          sed -i "s/^version=.*/version=v${{ steps.ver.outputs.version }}/" "$WORKDIR/module.prop"
          sed -i "s/^versionCode=.*/versionCode=${{ steps.ver.outputs.vcode }}/" "$WORKDIR/module.prop"
          mkdir -p out
          ( cd "$WORKDIR" && zip -rq "$GITHUB_WORKSPACE/out/Aksb2026CallerID-Systemize-Magisk-${{ steps.ver.outputs.version }}.zip" . -x ".*" )

      - name: Upload Systemize module artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aksb2026CallerID-Systemize-Magisk-${{ steps.ver.outputs.version }}
          path: out/Aksb2026CallerID-Systemize-Magisk-*.zip
          if-no-files-found: error
