pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        // Xposed API repository (do not put JitPack before this; it can cause unnecessary timeouts)
        maven { url 'https://api.xposed.info/' }
        // Fallback mirror for the legacy Xposed API 82 artifact
        maven { url 'https://artifactory.appodeal.com/appodeal-public/' }
        maven { url 'https://maven.aliyun.com/repository/public/' }
    }
}

rootProject.name = "CallerIDModule"
include ':app'
